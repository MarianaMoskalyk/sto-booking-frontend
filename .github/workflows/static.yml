name: Deploy React Site

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './sto-booking/package-lock.json' # Додаємо шлях до кешу

      - name: Install dependencies
        run: npm install
        working-directory: ./sto-booking # Перевірте, чи назва папки точно така

      - name: Build
        run: npm run build
        working-directory: ./sto-booking

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './sto-booking/dist' # Шлях до результату збірки теж має включати папку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
